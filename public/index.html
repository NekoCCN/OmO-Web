<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>OmO Web · 会话工作台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="button skip-link" id="skip-link" href="#conversation">跳至对话</a>
  <div class="workspace">
    <aside class="sidebar" id="navigation" aria-labelledby="brand">
      <div class="sidebar-head stack">
        <div class="row row--between">
          <div class="brand" id="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></svg>
            <span>OmO Web</span>
          </div>
          <button type="button" class="button button--quiet mobile-only" id="close-navigation">关闭</button>
        </div>
        <button type="button" class="button" id="new-sidebar" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          新会话
        </button>
        <label class="field"><span class="sr-only">搜索会话</span><input id="search" type="search" placeholder="搜索会话或目录" autocomplete="off"></label>
        <div class="filters" role="group" aria-label="会话筛选">
          <button type="button" class="button button--quiet" id="recent" aria-pressed="true">最近</button>
          <button type="button" class="button button--quiet" id="archived" aria-pressed="false">已归档</button>
        </div>
      </div>
      <nav class="sessions" aria-label="会话列表"><ul id="session-list"></ul><p id="list-empty" class="muted small">正在读取会话…</p></nav>
      <div class="sidebar-footer stack stack--tight">
        <div class="row row--between">
          <p id="connection" class="connection small" role="status"><span class="status-dot"></span><span id="connection-label">正在连接</span></p>
          <label class="theme"><span class="sr-only">外观</span><select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
        </div>
        <p id="engine-version" class="small muted break" hidden></p>
      </div>
    </aside>
    <button type="button" id="nav-scrim" class="nav-scrim" aria-label="关闭会话导航" tabindex="-1" hidden></button>
    <main class="main" id="conversation" tabindex="-1">
      <header class="workspace-head">
        <button type="button" class="button mobile-only" id="open-navigation" aria-controls="navigation" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14"/></svg>会话
        </button>
        <div class="session-heading">
          <h1 id="session-title">会话工作台</h1>
          <p id="session-path" class="path small muted" hidden></p>
        </div>
        <div class="row workspace-actions">
          <button type="button" class="button button--quiet" id="details-button" hidden>运行详情</button>
          <button type="button" class="button button--quiet" id="manage-button" hidden>会话管理</button>
        </div>
      </header>
      <div id="banner" class="banner" hidden>
        <p id="banner-text" class="error small" role="alert"></p>
        <button type="button" class="button button--quiet" id="retry">重新连接</button>
      </div>
      <div class="transcript" id="transcript" tabindex="0" aria-label="对话记录">
        <div class="conversation">
          <section id="welcome" class="welcome stack">
            <svg class="welcome-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="5.5" width="25" height="21" rx="3.5"/><path d="m9 12 4 4-4 4m8 0h6"/></svg>
            <h2>在本机开始一段会话</h2>
            <p class="muted" id="welcome-copy">选择工作目录后开始新会话，或从会话列表继续此前的工作。</p>
            <div><button type="button" class="button button--primary" id="new-welcome" disabled>新会话</button></div>
          </section>
          <section id="inactive-session" class="welcome stack" hidden>
            <h2 id="inactive-title">继续此会话</h2>
            <p id="inactive-copy" class="muted"></p>
            <p id="session-error" class="notice error small" role="alert" hidden></p>
            <div><button type="button" class="button button--primary" id="resume" hidden>恢复会话</button></div>
          </section>
          <section id="active-session" aria-label="会话内容" hidden>
            <div id="no-messages" class="conversation-empty stack stack--tight">
              <h2>暂无消息</h2><p class="muted">可以在下方输入这次要做的事。</p>
            </div>
            <div id="messages" class="messages"></div>
            <div id="interactions" class="stack interactions"></div>
          </section>
        </div>
      </div>
      <section class="composer-shell" id="composer-shell" aria-label="消息输入" hidden>
        <form id="composer" class="composer stack stack--tight">
          <p id="compose-error" class="notice error small" role="alert" hidden></p>
          <div id="activity-row" class="row small activity" hidden>
            <p id="activity" role="status"></p>
            <button type="button" class="button button--quiet" id="jump-to-request" hidden>查看待答项</button>
          </div>
          <div id="attachments" class="row attachments" aria-label="待发送图片" hidden></div>
          <div class="compose-box">
            <label for="prompt" class="sr-only">消息</label>
            <textarea id="prompt" rows="3" placeholder="输入消息…" aria-describedby="composer-hint"></textarea>
            <div class="compose-toolbar">
              <div class="row compose-options">
                <label><span class="sr-only">模型</span><select id="model" title="模型" disabled><option>模型</option></select></label>
                <label><span class="sr-only">思考档</span><select id="thinking" title="思考档" disabled><option>思考档</option></select></label>
                <button class="button button--quiet" id="attach" type="button" title="添加图片">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 11.2 11.4 20a5 5 0 0 1-7.1-7.1l9-9a3.5 3.5 0 0 1 5 5l-8.8 8.8a2 2 0 1 1-2.8-2.8l7.6-7.6"/></svg><span class="sr-only">添加图片</span>
                </button>
                <input id="files" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
                <label><span class="sr-only">发送方式</span><select id="prompt-mode" title="发送方式">
                  <option value="prompt">普通发送</option><option value="steer">引导当前轮</option><option value="follow_up">本轮后发送</option>
                </select></label>
              </div>
              <div class="row compose-submit">
                <button type="button" class="button button--primary" id="stop" hidden>停止</button>
                <button type="submit" class="button button--primary" id="send" disabled>发送</button>
              </div>
            </div>
          </div>
          <div class="row row--between composer-meta">
            <p id="composer-hint" class="small muted"></p><p id="context-usage" class="small muted numerical" hidden></p>
          </div>
        </form>
      </section>
    </main>
  </div>
  <dialog id="new-dialog" aria-labelledby="new-title">
    <form id="new-form" class="stack">
      <h2 id="new-title">新会话</h2>
      <label class="field"><span>工作目录</span><select id="new-cwd" required autofocus></select></label>
      <label class="field"><span>会话名称（选填）</span><input id="new-name" type="text" maxlength="120" autocomplete="off"></label>
      <p id="new-error" class="notice error small" role="alert" hidden></p>
      <footer class="row">
        <button type="button" class="button" data-close>取消</button>
        <button type="submit" class="button button--primary" id="create">创建会话</button>
      </footer>
    </form>
  </dialog>
  <dialog id="manage-dialog" aria-labelledby="manage-title">
    <div class="stack">
      <div class="row row--between"><h2 id="manage-title">会话管理</h2><button type="button" class="button button--quiet" data-close autofocus>关闭</button></div>
      <div id="manage-body" class="stack"></div>
      <p id="manage-error" class="notice error small" role="alert" hidden></p>
    </div>
  </dialog>
  <dialog id="details-dialog" aria-labelledby="details-title">
    <div class="stack">
      <div class="row row--between"><h2 id="details-title">运行详情</h2><button type="button" class="button button--quiet" data-close autofocus>关闭</button></div>
      <div id="details-body" class="stack"></div>
      <p id="details-error" class="notice error small" role="alert" hidden></p>
    </div>
  </dialog>
  <noscript>此工作台需要 JavaScript 才能连接本机会话服务。</noscript>
</body>
</html>
